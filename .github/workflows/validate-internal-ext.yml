name: Validate Internal EXT Fallback

on:
  push:
    branches:
      - feature/internal-ext-fallback
  workflow_dispatch:

jobs:
  build-t-embed:
    name: Build LilyGo T-Embed CC1101 internal-ext
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Clean stale sdkconfig
        run: |
          rm -f sdkconfig
          rm -f build_t_embed/sdkconfig

      - name: Install ESP-IDF system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget flex bison gperf python3 python3-pip python3-venv \
            cmake ninja-build ccache libffi-dev libssl-dev dfu-util \
            libusb-1.0-0 libglib2.0-dev

      - name: Cache ESP-IDF
        uses: actions/cache@v6
        id: idf-cache
        with:
          path: ~/esp/esp-idf
          key: esp-idf-v5.4.1
          restore-keys: esp-idf-v5.4.1

      - name: Clone ESP-IDF v5.4.1
        if: steps.idf-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/esp
          git clone --branch v5.4.1 --depth 1 \
            https://github.com/espressif/esp-idf.git ~/esp/esp-idf

      - name: Cache ESP-IDF tools
        uses: actions/cache@v6
        id: idf-tools-cache
        with:
          path: ~/.espressif
          key: esp-idf-tools-v5.4.1

      - name: Install ESP-IDF tools
        if: steps.idf-tools-cache.outputs.cache-hit != 'true'
        run: ~/esp/esp-idf/install.sh all

      - name: Build T-Embed
        run: |
          source ~/esp/esp-idf/export.sh
          bash ./build.sh --board t_embed --build-only

      - name: Verify internal ext partition and image size
        run: |
          grep -q '^ext_fat' partitions_ota_16mb.csv
          grep -q '0x490000,  0xB50000' partitions_ota_16mb.csv
          test -f build_t_embed/furi_esp32.bin
          test -f build_t_embed/bootloader/bootloader.bin
          test -f build_t_embed/partition_table/partition-table.bin
          APP_SIZE=$(stat -c%s build_t_embed/furi_esp32.bin)
          APP_LIMIT=$((0x480000))
          echo "App image: ${APP_SIZE} bytes / ${APP_LIMIT} bytes partition"
          test "${APP_SIZE}" -lt "${APP_LIMIT}"

      - name: Stage flash package
        run: |
          rm -rf artifact_staging
          mkdir -p artifact_staging/bootloader artifact_staging/partition_table
          cp build_t_embed/furi_esp32.bin artifact_staging/furi_esp32.bin
          cp build_t_embed/bootloader/bootloader.bin artifact_staging/bootloader/bootloader.bin
          cp build_t_embed/partition_table/partition-table.bin artifact_staging/partition_table/partition-table.bin
          if [ -f build_t_embed/flash_project_args ]; then
            cp build_t_embed/flash_project_args artifact_staging/flash_args.txt
          fi
          sed \
            -e 's/__BOARD_NAME__/lilygo_t_embed_cc1101/g' \
            -e 's/__CHIP__/esp32s3/g' \
            -e 's/__FLASH_SIZE__/16MB/g' \
            tools/flash_linux.sh > artifact_staging/flash_linux.sh
          chmod +x artifact_staging/flash_linux.sh
          sed \
            -e 's/__BOARD_NAME__/lilygo_t_embed_cc1101/g' \
            -e 's/__CHIP__/esp32s3/g' \
            -e 's/__FLASH_SIZE__/16MB/g' \
            tools/flash_windows.bat > artifact_staging/flash_windows.bat

      - name: Upload flash package
        uses: actions/upload-artifact@v7
        with:
          name: flipper-t-embed-internal-ext
          path: artifact_staging/
          retention-days: 30
